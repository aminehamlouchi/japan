                margin: 0 0 15px;

            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

                text-transform: uppercase;
                outline: 0;
                background: #c63f28;
                width: 100%;
                border: 0;
                padding: 15px;
                color: #ffffff;
                font-size: 14px;

            .staticrypt-html {

            .staticrypt-body {
                height: 100%;
                margin: 0;

                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-size: 1.5em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;

                vertical-align: text-bottom;
                border: 0.25em solid gray;
                border-right-color: transparent;
