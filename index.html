}
/* ---- ranked choice for the stays ---- */
function allBallots(stop){
  const out = {};
  (vote.all||[]).filter(v=>v.item.startsWith(`stay-${stop.id}-`)).forEach(v=>{ const key=v.item.slice(`stay-${stop.id}-`.length); if(!stop.options.some(o=>o.key===key)) return; (out[v.person] = out[v.person] || []).push({key, r:v.score}); });
  Object.keys(out).forEach(p=>{ out[p].sort((a,b)=>a.r-b.r); out[p] = out[p].map(x=>x.key); });
  return out;   // person -> [keys by preference], whatever they ranked
}
/* v29: every ranking counts for the places it ranks (allBallots). A place added later is "not placed yet" for that
   person until they put it where they want; their order is never set aside and nothing is deleted.
   ballotsFor = the people who have placed every option the stop has now. It is what "done" means for the hub
   action, the badge and the tab tick. oldBallotsFor = the people who still have something to place. */
function ballotsFor(stop){ const all = allBallots(stop), out = {}; Object.keys(all).forEach(p=>{ if(all[p].length === stop.options.length) out[p] = all[p]; }); return out; }
function oldBallotsFor(stop){ const all = allBallots(stop), out = {}; Object.keys(all).forEach(p=>{ if(all[p].length < stop.options.length) out[p] = all[p]; }); return out; }
const isNewOpt = o => !!o.added && Date.now() < Date.parse(o.added + "T00:00:00Z") + 21*86400000;
const warnsOf = o => (o.good||[]).filter(g=>/^not confirmed yet/i.test(g));
const newCount = () => STOPS.reduce((a,st)=>a + st.options.filter(isNewOpt).length, 0);
/* a stop may carry notes:[{on:"YYYY-MM-DD", t:"..."}], for example when a place is taken off. Each shows for 21 days. */
const stopNotes = st => (st.notes||[]).filter(n=>Date.now() < Date.parse(n.on + "T00:00:00Z") + 21*86400000).map(n=>`<div class="sp-note">${esc(n.t)}</div>`).join("");

/* ---- stay profile (v25): what a place is like, at a glance. Every value comes from the option in STOPS:
   hook (what makes it special), catch (the main trade-off), tags (up to 3 things it has), rating and reviews
   (guest score out of 10 and how many reviews it comes from), scores (category scores), say (what guests say).
   The cost level is worked out here from the price, so it never needs typing. ---- */
const personNights = s => s.options[0].nightly.reduce((a,_,k)=>a + PEOPLE.filter(p=>s.first+k>=p.from && s.first+k<p.to).length, 0);
const perNightEach = (o,s) => o.yen / personNights(s);
const COST_LEVELS = [[5000,"Frugal"],[11000,"Budget"],[17500,"Mid-range"],[Infinity,"Pricey"]];   /* yen per person per night */
function costLevel(o,s){ const y = perNightEach(o,s); const i = COST_LEVELS.findIndex(l=>y<l[0]); return {i, word:COST_LEVELS[i][1], y}; }
function pips(o,s){ const c = costLevel(o,s); return `<span class="pips" role="img" aria-label="Cost level ${c.i+1} of 4, ${c.word}" title="${c.word}: about ${usd(c.y)} per person per night">${[0,1,2,3].map(k=>`<i class="${k<=c.i?"on":""}"></i>`).join("")}</span>`; }
const costLine = (o,s) => { const c = costLevel(o,s); return `${pips(o,s)} <b>${c.word}</b> · about ${usd(c.y)} a night each`; };
const FEW_REVIEWS = 30;
const scoreOf = o => parseFloat(o.rating) || 0;
const scoreWord = r => r>=9 ? "Superb" : r>=8.5 ? "Excellent" : r>=8 ? "Very good" : r>=7 ? "Good" : "Mixed";
const scoreBand = r => r>=9 ? 4 : r>=8.5 ? 3 : r>=8 ? 2 : 1;
const nfmt = n => Number(n).toLocaleString("en-US");
function reviewsTxt(o){ return o.reviews ? `${o.reviews < FEW_REVIEWS ? "only " : ""}${nfmt(o.reviews)} review${o.reviews===1?"":"s"}` : ""; }
function gsBadge(o){ const r = scoreOf(o);
  return r ? `<span class="gs b${scoreBand(r)}${o.reviews && o.reviews < FEW_REVIEWS ? " thin" : ""}" title="Guest score ${r.toFixed(1)} out of 10${o.reviews?`, from ${nfmt(o.reviews)} reviews`:""}">${r.toFixed(1)}</span>`
           : `<span class="gs none" title="No guest score yet">?</span>`; }
/* one line: the badge, the word, how many reviews */
function guestLine(o){ const r = scoreOf(o), rv = reviewsTxt(o), few = o.reviews && o.reviews < FEW_REVIEWS;
  return `<span class="gl">${gsBadge(o)}<span><b>${r ? (few ? "Too few to trust" : scoreWord(r)) : "No score yet"}</b>${rv?` · <span class="${few?"few":""}">${rv}</span>`:""}</span></span>`; }
/* category scores as small full-scale meters, plus what guests say when we have it */
function guestMore(o, compact){
  const sc = (o.scores||[]).map(([k,v])=>`<div class="ss-i"><span>${esc(k)}</span><b>${Number(v).toFixed(1)}</b><i><u style="width:${Math.max(0,Math.min(100,v*10))}%"></u></i></div>`).join("");
  const say = o.say ? `${o.say.up?`<div class="say"><b>Guests like</b> ${esc(o.say.up)}</div>`:""}${o.say.down?`<div class="say"><b>Guests gripe about</b> ${esc(o.say.down)}</div>`:""}` : "";
  return (sc ? `<div class="ss" aria-label="Guest scores by category, out of 10">${sc}</div>` : "") + say; }
function runoff(stop, ballots){
  let alive = stop.options.map(o=>o.key); const rounds = []; const names = Object.keys(ballots);
  if(!names.length) return {winner:null, rounds};
  /* overall placement: lower is better. Only used to break a tie for last place. */
  const pts = k => names.reduce((a,p)=>{ const i = ballots[p].indexOf(k); return a + (i<0 ? alive.length : i); }, 0);
  while(alive.length){
    const count = {}; alive.forEach(k=>count[k]=0); let live = 0;
    names.forEach(p=>{ const first = ballots[p].find(k=>alive.includes(k)); if(first){ count[first]++; live++; } });
    const round = {count:{...count}, live}; rounds.push(round);
    const max = Math.max(...alive.map(k=>count[k])), min = Math.min(...alive.map(k=>count[k]));
    if(max > live/2 || alive.length===1) return {winner:alive.find(k=>count[k]===max), rounds, live};
    const lows = alive.filter(k=>count[k]===min);
    if(lows.length===alive.length){ const ps = alive.map(pts); if(alive.length===2 || Math.max(...ps)===Math.min(...ps)){ round.tie = alive.slice(); return {winner:null, tie:alive.slice(), rounds, live}; } }
    let out = lows[0];
    if(lows.length>1){ const worst = Math.max(...lows.map(pts)); const c = lows.filter(k=>pts(k)===worst); out = c[c.length-1]; round.tb = true; }
    round.out = out; alive = alive.filter(k=>k!==out);
  }
  return {winner:null, rounds};
}

   v26: THE STAYS, ONE STOP AT A TIME
   Photos, amenities, a details sheet, and a rank button that only ranks.

/* Photos are the place's own, loaded from its listing. A pic is [id, key, caption]. Nothing is copied into the repo. */

const amIcon = k => `<svg class="ami" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${AMI[k]||""}</svg>`;
const AMEN = [["bath","Bathrooms"],["tub","Bathtub"],["beds","Beds"],["kitchen","Kitchen"],["laundry","Laundry"],["lounge","Shared living room"],["desk","Front desk"],["bags","Bag storage"],["lift","Elevator"],["meals","Meals"],["onsen","Hot spring"],["view","View"],["wifi","Free Wi-Fi"]];
function amOf(o, k){ const v = (o.am||{})[k];
  if(k==="beds" && o.sleep){ const z = sleepOf(o); return {st:z.st, t:`${z.head}. ${z.t}`}; }
  if(v===undefined) return {st:"na", t:"Not said"}; if(v===false) return {st:"no", t:"No"}; if(v===true) return {st:"yes", t:"Yes"};
  return v[0]==="!" ? {st:"warn", t:v.slice(1)} : {st:"yes", t:v}; }
/* the few things worth a chip on the card, most telling first */
const AM_CHIP = [

 ["bath", a=>/^One per/.test(a.t) ? "Own bathrooms" : ""], ["desk", a=>a.t==="24 hours" ? "24-hour desk" : ""], ["bags", a=>a.t==="Yes" ? "Bag storage" : ""]];
function amChips(o, n=4){ const out = [];
  for(const [k,f] of AM_CHIP){ const a = amOf(o,k); if(a.st!=="yes") continue; const t = f(a); if(t) out.push(`<span class="amc">${amIcon(k)}${esc(t)}</span>`); if(out.length>=n) break; }
  return out.join(""); }
function amGrid(o){
  const it = AMEN.map(([k,l])=>({k, l, ...amOf(o,k)}));
  const has = it.filter(x=>x.st==="yes"||x.st==="warn"), no = it.filter(x=>x.st==="no"), na = it.filter(x=>x.st==="na");

/* which stop is showing, and which half of the Vote page */
let stayTab = null, voteSeg = null;
try{ stayTab = sessionStorage.getItem("j26-staytab"); voteSeg = sessionStorage.getItem("j26-voteseg"); }catch(e){}

/* v44, Amine, Oct 13: "have a button to place it elsewhere to slide it between others". A row of spots: for a place you
   haven't placed, every spot from 1st to the next open one (that one is outlined as the usual pick); for a placed one,
   every spot in your order. Tapping a spot puts it there and moves the rest down one. */
let spotOpen = null;   // "stop:key" of the card or order row whose spot picker is open
function spotChips(stop, key){
  const o = myOrder(stop), pos = o.indexOf(key), n = pos>=0 ? o.length : o.length+1, short = esc(stop.options.find(x=>x.key===key).short);
  return `<div class="spot" role="group" aria-label="Where ${short} goes in your order">${Array.from({length:n},(_,i)=>`<button class="spot-b ${i===pos?"on":pos<0&&i===n-1?"sug":""}" data-spot="${stop.id}:${key}:${i}" ${i===pos?'aria-pressed="true"':""} aria-label="Make ${short} your ${ORDW[i]} choice">${ORDW[i]}</button>`).join("")}</div>`;
}
function curStop(){ const stops = rankStops(), me = meP();
  let s = stops.find(x=>x.id===stayTab);
  if(!s){ s = (me && stops.find(x=>!ballotsFor(x)[me.name])) || stops[0]; stayTab = s.id; }
  return s; }

/* ---- v29: your order is a list you can move. Nothing is ever started over. ----
   A ranking is the person's stored order for a stop (items stay-<stop>-<option>, score = rank). It may be shorter than
   the list of options: a place added later, or one the person has not got to, is "not placed yet". Such a ranking still
   counts for the places it ranks. Every change saves by itself. */
const myOrder = stop => { const me = meP(); return me ? (allBallots(stop)[me.name] || []) : []; };
const ordSave = {};   // stopId -> {timer, order, state: "saving" | "saved" | "error"}
function ordStatus(stop){ const s = ordSave[stop.id];
  const t = !s ? "Saves by itself" : s.state==="saving" ? "Saving…" : s.state==="error" ? "Not saved. Move something to try again." : "Saved ✓";
  return `<span class="ord-st ${s?s.state:""}" id="ordst-${stop.id}" role="status">${t}</span>`; }
function writeOrder(stop, who, order){
  const keys = stop.options.map(o=>o.key);
  vote.all = (vote.all||[]).filter(v=>!(v.person===who && keys.some(k=>v.item===`stay-${stop.id}-${k}`)));
  order.forEach((key,i)=>vote.all.push({item:`stay-${stop.id}-${key}`, person:who, score:i+1, updated:new Date().toISOString()}));
}
/* the shared data was fetched again while a change of mine was still on its way: keep my change on top of it */
function reapplyOrders(){ Object.keys(ordSave).forEach(id=>{ const s = ordSave[id]; if(s.order && s.state!=="saved") writeOrder(stopById(id), s.who, s.order); }); }
function setOrder(stop, order){
  const me = meP(); if(!me) return;
  if(!vote.all){ toast("The group's rankings haven't loaded yet. Try again in a moment."); return; }   /* never write an order on top of one we could not read */
  const keys = stop.options.map(o=>o.key); order = order.filter((k,i)=>keys.includes(k) && order.indexOf(k)===i);
  if(order.join("|") === myOrder(stop).join("|")){ redrawStays(); return; }   /* nothing changed: put the list back as it was */
  writeOrder(stop, me.name, order);
  const s = ordSave[stop.id] = ordSave[stop.id] || {}; s.state = "saving"; s.order = order.slice(); s.who = me.name; clearTimeout(s.timer);
  s.timer = setTimeout(()=>pushOrder(stop), 900);
  redrawStays(); setNav("vote"); badgeSoon();
}
async function pushOrder(stop){
  const s = ordSave[stop.id]; if(!s || !s.order) return; clearTimeout(s.timer); s.timer = null; const order = s.order;
  try{
    for(let i=0;i<order.length;i++){ const r = await fetch(VOTE_API, {method:"POST", keepalive:true, headers:{"X-Key":VOTE_KEY, "Content-Type":"application/json"}, body:JSON.stringify({item:`stay-${stop.id}-${order[i]}`, person:s.who, score:i+1})}); if(!r.ok) throw new Error(r.status); }
    if(s.order===order) s.state = "saved";
  }catch(e){ if(s.order===order){ s.state = "error"; toast("Couldn't save your order. Check your connection, then move something to try again."); } }
  const el = document.getElementById("ordst-"+stop.id); if(el) el.outerHTML = ordStatus(stop);
}
/* leaving the page with a change still waiting: send it now */
const flushOrders = () => Object.keys(ordSave).forEach(id=>{ if(ordSave[id].timer) pushOrder(stopById(id)); });
window.addEventListener("pagehide", flushOrders);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushOrders(); });

function orderList(stop, c){

  const div = un.length ? `<li class="ord-div">${placed.length ? `Not placed yet (${un.length}). Drag one up, tap Place for the next open spot, or Spot to pick where it goes.` : `Tap Place on your favorite, then the next. Or drag them into order.`}</li>` : "";

function stayCard(o, stop, c){

      <div class="sc-f">${btn}<button class="btn ghost sm" data-stay="${stop.id}:${o.key}">Details</button></div>
      ${c.me && !on && c.order.length ? (spotOpen===stop.id+":"+o.key ? `<div class="sc-spot"><span class="spot-l">Put it at:<button class="linkbtn tiny" data-spotopen="${stop.id}:${o.key}">Cancel</button></span>${spotChips(stop, o.key)}</div>` : `<button class="linkbtn spot-lnk" data-spotopen="${stop.id}:${o.key}" aria-expanded="false">Or pick another spot ›</button>`) : ""}

function rankCard(stop){
  const me = meP(), ballots = allBallots(stop), order = me ? (ballots[me.name] || []) : [];
  const res = runoff(stop, ballots), nVoted = Object.keys(ballots).length, first = res.rounds[0] ? res.rounds[0].count : {};
  const n = stop.options.length, oname = k => esc(stop.options.find(o=>o.key===k).short), left = n - order.length;
  const c = {me, ballots, order, res, nVoted, first};
  const unNew = stop.options.filter(o=>!order.includes(o.key) && isNewOpt(o)).length;
  const hint = !me ? "Pick who you are, then rank."
    : !order.length ? "Put the places in your order. Tap Place, or the button on a card."
    : left && unNew===left ? `Your order is kept. ${left===1?"One new place is":`${left} new places are`} waiting to be placed where you want.`
    : left ? `${left} still to place.`
    : "Your ranking is in. Drag a row or use the arrows to change it any time.";
  const part = VOTERS.map(p=>p.name).filter(x=>ballots[x] && ballots[x].length<n);
  const tally = (nVoted ? `<div class="small muted">${nVoted} of ${VOTERS.length} ranked${res.winner?` · leading after ${res.rounds.length} round${res.rounds.length>1?"s":""}: <b>${oname(res.winner)}</b>`:res.tie?` · <b>tied</b>: ${listAnd(res.tie.map(oname))}`:""}</div>` : `<div class="small muted">Nobody has ranked yet.</div>`)
    + (part.length ? `<div class="small muted rk-old">Still to place every option: ${faces(part,"xs")} ${part.map(esc).join(", ")}. Their order counts for the places they ranked.</div>` : "");
  const stops = rankStops(), i = stops.indexOf(stop), nx = stops[(i+1)%stops.length];
  return `<div class="card rankcard" id="rank-${stop.id}" data-ctx="rank|${stop.id}|Ranking: ${esc(stop.title)}">
    <div class="sp-h"><b>${esc(stop.title)}</b><span class="small muted">${esc(stop.dates)} · ${stop.nights} night${stop.nights>1?"s":""}</span></div>

}

/* ---- v32: the comparison chart. Amine, Oct 6: the Beds row says whether we each get our own bed; each place carries
   the place you ranked it; columns can be hidden and moved. What is hidden and the order are kept on this phone, per stop. ---- */
/* Does each of us get a bed? Amine, Oct 6: "whats most important is that it clearly says if we get our own bed/futon or
   whatever and none of us share". From the option's `sleep`: beds = how many of the 7 get a real bed (null = not known yet),
   rest = what the others sleep on, in a few words, t = what the beds are. Nobody shares at any place we hold, so every
   verdict starts with that. If a place ever would make two people share, give it sleep.share (a sentence) and it says so. */
function sleepOf(o){ const z = o.sleep; if(!z) return null;
  if(z.share) return {st:"warn", shares:true, top:"Some of us would share", what:z.share, head:`Some of us would share. ${z.share}`, t:z.t};
  const what = z.beds == null ? "Beds or futons not known yet" : z.beds >= 7 ? "A real bed each" : `${z.beds} real bed${z.beds===1?"":"s"}, ${7-z.beds} on ${z.rest || "futons or sofa beds"}`;
  return {st:z.beds >= 7 ? "yes" : "warn", top:"Nobody shares", what, head:`Nobody shares. ${what}`, t:z.t}; }
const cmpState = store.get("j26-cmp", {});
function cmpCols(stop){ const st = cmpState[stop.id] || {}, keys = stop.options.map(o=>o.key), so = (st.order||[]).filter(k=>keys.includes(k));
  const order = so.concat(keys.filter(k=>!so.includes(k))), hide = (st.hide||[]).filter(k=>keys.includes(k));
  return {order, hide, shown:order.filter(k=>!hide.includes(k)), changed:hide.length>0 || order.join()!==keys.join()}; }
function cmpSave(stop, order, hide){ if(order) cmpState[stop.id] = {order, hide}; else delete cmpState[stop.id]; store.set("j26-cmp", cmpState); }
function compareGrid(stop){
  const me = meP(), c = cmpCols(stop), opts = c.shown.map(k=>stop.options.find(o=>o.key===k)), n = opts.length, mine = myOrder(stop);
  const row = (label, cells, cls="") => `<div class="cg-l ${cls}">${label}</div>${cells.map(x=>`<div class="cg-c ${cls}">${x}</div>`).join("")}`;
  const am = (o,k) => { const a = amOf(o,k);
    if(k==="beds" && sleepOf(o)){ const z = sleepOf(o); return `<span class="cg-own ${z.shares?"no":""}">${z.shares?`<span class="cgw">!</span>`:`<span class="cgy">✓</span>`} ${esc(z.top)}</span><span class="cg-what">${z.st==="yes"?`<span class="cgy">✓</span>`:`<span class="cgw">!</span>`} <b>${esc(z.what)}</b></span><span class="cg-sub">${esc(z.t)}</span>`; }
    return a.st==="yes" ? `<span class="cgy">✓</span>${a.t!=="Yes"?" "+esc(a.t):""}` : a.st==="warn" ? `<span class="cgw">!</span> ${esc(a.t)}` : a.st==="no" ? `<span class="muted">No</span>` : `<span class="muted">not said</span>`; };
  const rows = [

/* dragging a row by its handle. A placed row stays among the placed ones; an unplaced row dropped above the line is placed there. */
let ordDrag = null;
function ordRenumber(list){ let n = 0, past = false; [...list.children].forEach(li=>{ if(li.classList.contains("ord-div")){ past = true; return; } const b = li.querySelector(".ord-n"); if(b) b.textContent = past ? "+" : ++n; }); }

  const g = e.target.closest(".ord-g"); if(!g || !meP()) return;

  if(!ordDrag || e.pointerId!==ordDrag.id) return; e.preventDefault();
  const {row, list} = ordDrag, div = list.querySelector(".ord-div"), y = e.clientY;
  let before = null;
  for(const sib of [...list.children]){ if(sib===row) continue; const r = sib.getBoundingClientRect(); if(y < r.top + r.height/2){ before = sib; break; } }
  if(ordDrag.placed && div && (before===null || before===div || (div.compareDocumentPosition(before) & Node.DOCUMENT_POSITION_FOLLOWING))) before = div;
  if(before === row.nextElementSibling) return;
  /* the row being held never leaves the page (that would drop the finger's hold on it): its neighbors step past it instead */
  if(before && (before.compareDocumentPosition(row) & Node.DOCUMENT_POSITION_FOLLOWING)){ for(;;){ const p = row.previousElementSibling; if(!p) break; list.insertBefore(p, row.nextElementSibling); if(p===before) break; } }
  else { while(row.nextElementSibling && row.nextElementSibling !== before) list.insertBefore(row.nextElementSibling, row); }
  ordDrag.moved = true; row.classList.toggle("un", !!div && !!(div.compareDocumentPosition(row) & Node.DOCUMENT_POSITION_FOLLOWING)); ordRenumber(list);

function ordDrop(e){
  if(!ordDrag || (e.pointerId!=null && e.pointerId!==ordDrag.id)) return;

/* ---- what is new since this phone's last visit (v30) ----
   Amine, Oct 6: "the popup should show and the action should say the number of stays since they last visited, and a onle line of whats new".
   The phone remembers which stay options existed at its last visit (j26-stays-seen: known = there at the last visit, cur = there now).
   A visit ends after 30 minutes away. New to you = there now and not known. Nothing about this is sent anywhere. */
const VISIT_GAP = 30*60000;
const stayKeysNow = () => STOPS.filter(s=>s.decide).flatMap(s=>s.options.map(o=>s.id+":"+o.key));
let staysSeen = null;
function visitTick(){
  const now = Date.now(), cur = stayKeysNow(); let r = staysSeen || store.get("j26-stays-seen", null), rolled = false;
  if(!r || !Array.isArray(r.known)){
    /* The first time on this version: work out what this phone has seen from the last popup it closed.
       Popup 3 (Oct 5) announced the places added on Oct 5. A phone that never closed a popup has not been here before. */
    const g = store.get("j26-guide", 0), sawOct5 = g >= 3;
    r = {known:STOPS.filter(s=>s.decide).flatMap(s=>s.options.filter(o=>!o.added || (sawOct5 && o.added<="2026-10-05")).map(o=>s.id+":"+o.key)), cur, at:now, last:now, popped:false, first:!g};
  } else if(now - (r.last||0) > VISIT_GAP){ r = {known:r.cur||r.known, cur, at:now, last:now, popped:false, first:false}; rolled = true; }   /* a new visit: what was there last time is known now */
  else { const old = r.cur||[], same = old.join() === cur.join();
    if(cur.some(k=>!old.includes(k) && !r.known.includes(k))) r.popped = false;   /* places were added during this visit: the popup may show for them */
    r.cur = cur; if(same && now - r.last < 60000){ staysSeen = r; return false; } r.last = now; }
  staysSeen = r; store.set("j26-stays-seen", r); return rolled;
}
visitTick();
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && visitTick()){ keepScroll = true; render(); } });
/* the places that are new to this phone, as [{s, o}]. Once the rankings have loaded, a place the person already placed is left out. */
function newToMe(){
  if(staysSet()) return [];   // the stays are picked: no "new places" news, and the backups never show
  const me = meP(), out = [];
  STOPS.filter(s=>s.decide).forEach(s=>{ const mine = me && vote.all ? myOrder(s) : []; s.options.forEach(o=>{ const k = s.id+":"+o.key; if(staysSeen.cur.includes(k) && !staysSeen.known.includes(k) && !mine.includes(o.key)) out.push({s, o}); }); });
  return out;
}
const sinceVisit = () => staysSeen.first ? "" : " since your last visit";
/* one line of what is new: the line typed for the newest day places were added, then the earlier ones the phone has not seen either */
function stayNewsLine(list){
  const days = [...new Set(list.map(x=>x.o.added||""))].sort().reverse();
  const line = d => (d && STAY_NEWS[d]) || `New: ${listAnd(list.filter(x=>(x.o.added||"")===d).map(x=>`${x.o.short} (${stopTabName(x.s)})`))}.`;
  return days.map((d,i)=>i ? `Before that: ${line(d)}` : line(d)).join(" ");
}
/* what an action says to this person. Only "Rank the stays" changes: it counts the places that are new to them and says what is new. */
function actText(a){
  if(a.auto!=="ranks") return {t:a.t, n:a.n};
  const me = meP(), nw = newToMe();
  if(nw.length) return {t:`${a.t}: ${nw.length} new place${nw.length===1?"":"s"}${sinceVisit()}`, n:`${stayNewsLine(nw)} ${a.n}`, news:stayNewsLine(nw)};
  const left = me && vote.all ? rankStops().reduce((x,st)=>x + st.options.length - myOrder(st).length, 0) : 0, started = me && vote.all && rankStops().some(st=>myOrder(st).length);
  if(left && started) return {t:`${a.t}: ${left} place${left===1?"":"s"} left to place`, n:a.n};
  return {t:a.t, n:a.n};
}

/* v61: once votes lock, voting and ranking leave the to-do list */
const actFor = p => ACTIONS.filter(a => (a.who==="Everyone" || (p && a.who===p.name)) && !(votesLocked() && (a.id==="vote-plan" || a.id==="rank-stays")));
function actProgress(a, name){
  if(a.auto==="votes"){ const open=VOTE_ITEMS.filter(it=>it.open); const miss=open.filter(it=>!itemVotes(it.id).some(v=>v.person===name)); return {n:open.length-miss.length, of:open.length, word:"voted", missing:miss.map(it=>it.name)}; }
  if(a.auto==="ranks"){ const stops=STOPS.filter(s=>s.decide); const miss=stops.filter(s=>!ballotsFor(s)[name]); return {n:stops.length-miss.length, of:stops.length, word:"ranked", missing:miss.map(s=>s.title)}; }
  if(a.auto==="flight"){ const p=PEOPLE.find(p=>p.name===name); return {n:p&&!p.pending?1:0, of:1, word:"booked"}; }
  if(a.auto==="seen"){ const v=(vote.all||[]).find(v=>v.item==="act-"+a.id && v.person===name && v.score>0); const ok = !!v && (a.id!=="read-plan" || typeof PLAN_NEWS==="undefined" || String(v.note||"") >= PLAN_NEWS.id); return {n:ok?1:0, of:1, word:"done"}; }
  if(a.auto==="bags"){ return {n:(bagsSt.all||[]).some(r=>r.person===name)?1:0, of:1, word:"done"}; }
  return null;
}
const actDone = (id, name) => { const a = ACTIONS.find(x=>x.id===id); if(a && a.auto){ const pr = actProgress(a, name); return pr.n >= pr.of; } return !!(vote.all||[]).find(v=>v.item==="act-"+id && v.person===name && v.score>0); };
function myOpenActions(){ const me = meP(); if(!me) return []; return actFor(me).filter(a=>a.level==="now" && !actDone(a.id, me.name)); }
/* records a self-ticking action for the person on this phone (read-plan carries the plan update's id in note) */
async function markSeen(id, note){

  const item = "act-" + id, cur = vote.all.find(v=>v.item===item && v.person===me.name), key = item + "|" + me.name + "|" + note;
  if(cur && cur.score > 0 && String(cur.note||"") >= String(note||"")) return;
  if(markSeen.busy.has(key)) return; markSeen.busy.add(key);
  try{ const r = await fetch(VOTE_API, {method:"POST", headers:{"X-Key":VOTE_KEY, "Content-Type":"application/json"}, body:JSON.stringify({item, person:me.name, score:1, note})});
    if(r.ok){ vote.all = vote.all.filter(v=>!(v.item===item && v.person===me.name)); vote.all.push({item, person:me.name, score:1, note, updated:new Date().toISOString()}); keepScroll = true; render(); badgeSoon(); } }catch(_){}
  markSeen.busy.delete(key);
}
markSeen.busy = new Set();

/* offices for an action (the AAA list on the license task), with today's hours and whether it's open now, in Eastern time */
function placesHtml(a){
  if(!a.places) return "";
  const p = new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York", weekday:"short", hour:"numeric", minute:"numeric", hour12:false}).formatToParts(new Date());
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.find(x=>x.type==="weekday").value), hr = (+p.find(x=>x.type==="hour").value % 24) + (+p.find(x=>x.type==="minute").value)/60;
  const t = h => { const H = Math.floor(h), M = Math.round((h-H)*60); return `${H%12||12}${M?":"+String(M).padStart(2,"0"):""} ${H<12?"AM":"PM"}`; };
  const DN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const week = h => { const wk = h.slice(1,6), same = wk.every(x=>JSON.stringify(x)===JSON.stringify(wk[0])); let s = same && wk[0] ? `Mon to Fri ${t(wk[0][0])} to ${t(wk[0][1])}` : h.map((x,i)=>x?`${DN[i]} ${t(x[0])} to ${t(x[1])}`:"").filter(Boolean).join(", ");
    return s + (h[6] ? `, Sat ${t(h[6][0])} to ${t(h[6][1])}, closed Sun` : h[0] ? ", closed Sat" : ", closed weekends"); };
  const next = h => { for(let k=1;k<=7;k++){ const d=(wd+k)%7; if(h[d]) return `${k===1?"tomorrow":DN[d]} at ${t(h[d][0])}`; } return ""; };
  return `<div class="act-pl">${a.places.map(o=>{ const today = o.h[wd], open = today && hr>=today[0] && hr<today[1], later = today && hr<today[0];
    const st = open ? `<span class="chip c-green">Open now, until ${t(today[1])}</span>` : `<span class="chip c-line">Closed now${later?`, opens at ${t(today[0])}`:`, opens ${next(o.h)}`}</span>`;
    return `<div class="act-pli"><div style="flex:1;min-width:0"><b>${esc(o.n)}</b><div class="small">${esc(o.a)}</div><div class="tiny muted">${esc(week(o.h))}</div><div style="margin-top:4px">${st}</div></div><a class="btn ghost sm" href="${mapUrl("AAA " + o.n + " " + o.a)}" target="_blank" rel="noopener">${ICON.map}Map</a></div>`; }).join("")}</div>${a.away?`<p class="tiny muted" style="margin:6px 0 0">${esc(a.away)}</p>`:""}`;
}

const FIRE_PAL = [[7,7,7],[31,7,7],[47,15,7],[71,15,7],[87,23,7],[103,31,7],[119,31,7],[143,39,7],[159,47,7],[175,63,7],[191,71,7],[199,71,7],[223,79,7],[223,87,7],[223,87,7],[215,95,7],[215,95,7],[215,103,15],[207,111,15],[207,119,15],[207,127,15],[207,135,23],[199,135,23],[199,143,23],[199,151,31],[191,159,31],[191,159,31],[191,167,39],[191,167,39],[191,175,47],[183,175,47],[183,183,47],[183,183,55],[207,207,111],[223,223,159],[239,239,199],[255,255,255]];
function shibuyaIncident(){
  shBusy = true;
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ov = document.createElement("div"); ov.className = "jj"; ov.setAttribute("aria-hidden","true");
  const cv = document.createElement("canvas"); ov.appendChild(cv); document.body.appendChild(ov);
  const W = innerWidth, H = innerHeight, dpr = 1;
  cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+"px"; cv.style.height = H+"px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr);

  const FW = 128, FH = Math.max(80, Math.round(FW*H/W));
  const heat = new Uint8Array(FW*FH);
  const off = document.createElement("canvas"); off.width = FW; off.height = FH; const octx = off.getContext("2d");
  const img = octx.createImageData(FW, FH);

  const embers = Array.from({length:70},()=>({x:Math.random()*W, y:H+Math.random()*H, r:1+Math.random()*2.2, v:40+Math.random()*90, w:Math.random()*6.28, s:0.6+Math.random()*0.4}));
  const T = reduced ? 1.6 : 4.4, FIRE0 = reduced ? 0.2 : 1.2;
  const t0 = performance.now(); let lastTick = 0;
  const clamp = (v,a,b)=>v<a?a:v>b?b:v;
  function tick(t){
    const age = t - FIRE0;
    const src = clamp(age/0.5, 0, 1) * 36;                                   // bottom row heat ramps up fast
    const p = age < 1.2 ? 0.8 - 0.6*(age/1.2) : age < 1.8 ? 0.2 - 0.17*((age-1.2)/0.6) : 0.03;   // chance a cell cools as heat rises: high at first (low flames), near zero later (a wall of fire to the top)
    const passes = age < 0.4 ? 3 : age < 1.2 ? 6 : 10;                        // rows the fire climbs per tick
    for(let x=0;x<FW;x++){ heat[(FH-1)*FW+x] = clamp(Math.round(Math.random() < 0.85 ? src - Math.random()*4 : src*0.6), 0, 36); }
    for(let k=0;k<passes;k++) for(let y=1;y<FH;y++) for(let x=0;x<FW;x++){
      const s = y*FW+x, r = (Math.random()*3)|0; let d = s - FW - r + 1; if(d<0) d=0;
      const v = heat[s] - (Math.random() < p ? 1 : 0); heat[d] = v<0?0:v;
    }
    const px = img.data;
    for(let i=0;i<FW*FH;i++){ const h = heat[i] > 36 ? 36 : heat[i], c = FIRE_PAL[h]; const o = i*4; px[o]=c[0]; px[o+1]=c[1]; px[o+2]=c[2]; px[o+3] = h===0?0 : h<3?90 : h<6?170 : 255; }

  }
  function frame(now){
    const t = (now - t0)/1000;

    if(t >= FIRE0 - 0.1){ if(!lastTick) lastTick = now; let n = Math.min(6, Math.floor((now - lastTick)/25)); while(n-- > 0){ tick(t); lastTick += 25; } }

    /* shake once the fire is going */
    if(!reduced && t > FIRE0 && t < T-0.5){ const k = 3*Math.min(1,(t-FIRE0)*2); ctx.translate((Math.random()-0.5)*k*2, (Math.random()-0.5)*k*2); }
    /* 1. the map goes dark */
    ctx.fillStyle = `rgba(5,5,9,${0.93*Math.min(1,t/0.2)})`; ctx.fillRect(-10,-10,W+20,H+20);

    if(!reduced) slashes.forEach(s=>{ const p = clamp((t - s.t0)/0.13, 0, 1); if(p<=0) return; const fade = clamp(1 - (t - s.t0 - 0.13)/0.6, 0, 1);

      ctx.shadowBlur = 0; ctx.lineWidth = 1; ctx.strokeStyle = "rgba(255,110,80,.9)"; ctx.stroke(); ctx.restore();
      if(p<1 && p>0.2){ ctx.fillStyle = `rgba(255,255,255,${0.12*(1-p)})`; ctx.fillRect(-10,-10,W+20,H+20); } });
    /* 3. ignition: a streak of light across the screen, then a burst */
    if(!reduced && t > FIRE0-0.3 && t < FIRE0+0.55){ const q = clamp((t-(FIRE0-0.3))/0.3,0,1); const x = -80 + q*(W*0.5+80), y = H*0.52;
      const g = ctx.createLinearGradient(x-260,y,x,y); g.addColorStop(0,"rgba(255,120,30,0)"); g.addColorStop(0.7,"rgba(255,170,60,.9)"); g.addColorStop(1,"#fff");
      ctx.save(); ctx.strokeStyle = g; ctx.lineWidth = 6; ctx.lineCap="round"; ctx.shadowColor="#ffb347"; ctx.shadowBlur = 30; ctx.beginPath(); ctx.moveTo(x-260,y); ctx.lineTo(x,y); ctx.stroke(); ctx.restore();
      if(q>=1){ const b = clamp((t-FIRE0)/0.55,0,1); const rad = 40 + b*diag*0.8; const rg = ctx.createRadialGradient(W*0.5,y,0,W*0.5,y,rad); rg.addColorStop(0,`rgba(255,255,255,${0.95*(1-b)})`); rg.addColorStop(0.35,`rgba(255,190,70,${0.75*(1-b)})`); rg.addColorStop(1,"rgba(255,80,20,0)"); ctx.fillStyle = rg; ctx.fillRect(-10,-10,W+20,H+20); } }

    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function pfDraw(){
  const cv = document.getElementById("pfCv"); if(!cv || !ph.img) return;

  const c = cv.getContext("2d"); c.fillStyle = "#000"; c.fillRect(0,0,PH,PH); c.imageSmoothingQuality = "high"; c.drawImage(ph.img, ph.x, ph.y, w, h);

async function pfLoad(file){

  if(!img || !img.width){ toast("Couldn't read that photo. Try a JPG or PNG."); return; }
  ph.img = img; ph.min = PH/Math.min(img.width, img.height); ph.s = ph.min;
  ph.x = (PH-img.width*ph.s)/2; ph.y = (PH-img.height*ph.s)/2;

  document.getElementById("pfHint").hidden = false; document.getElementById("pfEmpty").hidden = true;

/* The awards on the Vote page, from how each person votes. */
function crewAwards(){
  const sl = (vote.all||[]).filter(v=>VOTE_ITEMS.some(it=>it.id===v.item));
  const st = VOTERS.map(p=>{ const vs = sl.filter(v=>v.person===p.name); const n = vs.length; return {name:p.name, n, avg:n?vs.reduce((a,v)=>a+v.score,0)/n:0, zero:vs.filter(v=>v.score===0).length, edge:vs.filter(v=>Math.abs(v.score)===5).length}; }).filter(s=>s.n>=5);
  if(st.length < 3) return `<p class="small muted" style="margin:0">The awards unlock once three of us have voted on five things each.</p>`;
  const top = (f, min=-Infinity) => { const s = st.slice().sort((a,b)=>f(b)-f(a))[0]; return f(s) > min ? s : null; };
  const sign = x => (x>0?"+":"") + x.toFixed(1);
  const aw = [
    ["盛", "Hype man", top(s=>s.avg), s=>`average ${sign(s.avg)}`],
    ["渋", "Hard to please", top(s=>-s.avg), s=>`average ${sign(s.avg)}`],

    ["無", "Whatever, bro", top(s=>s.zero, 1), s=>`${s.zero} votes of exactly zero`],
    ["票", "Most votes in", top(s=>s.n), s=>`${s.n} of ${VOTE_ITEMS.length} voted`],

  return `<div class="awards">${aw.map(a=>`<div class="aw"><span class="aw-f">${face(a[2].name, "lg")}<span class="hanko sm" aria-hidden="true">${a[0]}</span></span><b>${a[1]}</b><span class="small">${esc(a[2].name)}</span><span class="tiny muted">${a[3](a[2])}</span></div>`).join("")}</div>`;
}

async function sendNote(){
  const me = meP(); const text = rp.draft.trim(); if(!me || rp.sending) return;
  if(!text){ toast("Type something first."); return; }
  const c = rp.ctx || {}; const a = rpAgent(rp.agent);
  rp.sending = true; rpRender();
  try{
    const r = await crewFetch("/notes", {person:me.name, agent:a.id, text, page:c.page, ctx:{label:c.label, item:rp.useItem ? c.item : null, how:c.how, w:c.w}});
    rp.all = [r.note].concat(rp.all || []); rp.draft = ""; toast(`Sent to ${a.name}.`); badgeSoon();

/* =====================================================================
   WHO VOTED WHAT: per item, the whole board, and the ranking charts
   ===================================================================== */
const sgn = s => (s>0?"+":"") + s;
const foldOpen = {};   // remembers which of these folds are open across re-renders
document.addEventListener("toggle", e=>{ const d = e.target; if(d.dataset && d.dataset.keep) foldOpen[d.dataset.keep] = d.open; }, true);
const tint = s => s===0 ? "color-mix(in srgb, var(--muted) 12%, var(--card))" : `color-mix(in srgb, var(${s>0?"--pos":"--red"}) ${10+Math.abs(s)*10}%, var(--card))`;
const listAnd = a => a.length<3 ? a.join(" and ") : a.slice(0,-1).join(", ") + " and " + a[a.length-1];

/* Under each vote item: a column per person, tallest yes on the left, each bar ending at their face.
   The average gets its own column on the right and a dashed line across the whole chart. */
function whoVoted(id){
  const vs = itemVotes(id); if(!vs.length) return "";
  const by = {}; vs.forEach(v=>{ by[v.person] = v.score; });
  const yes = VOTERS.filter(p=>p.name in by).sort((a,b)=>by[b.name]-by[a.name]), no = VOTERS.filter(p=>!(p.name in by));
  const g = vAgg(id), avg = g.avg, U = 13, PAD = 32, H = PAD*2 + U*10;
  const y = v => (PAD + (5 - v)*U).toFixed(1);
  const bar = (v, cls) => v ? `<i class="vc-b ${cls}" style="top:${y(Math.max(v,0))}px;height:${(Math.abs(v)*U).toFixed(1)}px"></i>` : "";
  const col = p => { const v = by[p.name]; return `<div class="vc-col" data-vface="${esc(p.name)}: ${sgn(v)}, ${esc(VLAB[v])}" role="button" tabindex="0" aria-label="${esc(p.name)}: ${sgn(v)}, ${esc(VLAB[v])}">${bar(v, v>0?"p":"n")}<span class="vc-f" style="top:${y(v)}px">${face(p.name,"")}</span><b class="vc-v" style="top:${(+y(v) + (v<0?21:-21)).toFixed(1)}px">${sgn(v)}</b><span class="vc-n">${esc(p.name)}</span></div>`; };
  const a1 = (avg>0?"+":"") + avg.toFixed(1), word = verdict(avg, g.n);
  const avgCol = `<div class="vc-col vc-avg" aria-label="Average ${a1}">${bar(avg, "a")}<b class="vc-pill" style="top:${y(avg)}px">${a1}</b><span class="vc-n">Average</span></div>`;
  const chart = `<div class="vc" style="height:${H+18}px" role="img" aria-label="${esc(yes.map(p=>p.name+" "+sgn(by[p.name])).join(", "))}. Average ${a1}.">
    <i class="vc-band p" style="top:0;height:${y(0)}px"></i><i class="vc-band n" style="top:${y(0)}px;height:${(H - y(0)).toFixed(1)}px"></i>
    <span class="vc-side" style="top:${(+y(5)-22).toFixed(1)}px">yes</span><span class="vc-side" style="top:${(+y(-5)+10).toFixed(1)}px">no</span>
    <i class="vc-g" style="top:${y(5)}px"></i><i class="vc-g z" style="top:${y(0)}px"></i><i class="vc-g" style="top:${y(-5)}px"></i>
    <em class="vc-t" style="top:${y(5)}px">+5</em><em class="vc-t" style="top:${y(0)}px">0</em><em class="vc-t" style="top:${y(-5)}px">-5</em>
    <i class="vc-al" style="top:${y(avg)}px"></i>
    <div class="vc-cols">${yes.map(col).join("")}${avgCol}</div></div>`;
  const body = `<p class="vc-sum"><b>Average ${a1}</b> from ${g.n} of ${VOTE_FROZEN.voters} · ${esc(word)}${VOTE_FROZEN.items[id]?` · as counted when voting closed Oct 31`:""}</p>${chart}${no.length?`<p class="tiny muted vw-no">No vote yet: ${faces(no.map(p=>p.name),"xs")} ${no.map(p=>esc(p.name)).join(", ")}</p>`:""}`;
  return fold(`<span class="small">Who voted what</span>`, body, !!foldOpen["vw-"+id], "plain mini vwho", `data-keep="vw-${id}"`);
}

/* The whole board in one sheet: every item down the side, every person across the top. */
function boardHtml(){
  const by = {}; (vote.all||[]).forEach(v=>{ (by[v.item] = by[v.item] || {})[v.person] = v.score; });
  const groups = [{t:"Still undecided", items:VOTE_ITEMS.filter(it=>it.open)}].concat(DAYS.map((d,i)=>({t:`${dayLabel(i)} · ${d.short}`, items:VOTE_ITEMS.filter(it=>it.day===d.id)}))).filter(g=>g.items.length);

  const head = `<tr><th class="vb-i"><span class="tiny muted">Votes in, of ${VOTE_ITEMS.length}</span></th>${VOTERS.map(p=>`<th class="${p.name===ME?"me":""}">${face(p.name,"xs")}<small>${done(p)}</small></th>`).join("")}<th class="vb-a"><span class="tiny muted">All</span></th></tr>`;
  const row = it => { const r = by[it.id] || {}; const g = vAgg(it.id); const avg = g.n ? g.avg : null;
    return `<tr><th class="vb-i"><button data-boardgo="${it.id}">${esc(it.name)}</button></th>${VOTERS.map(p=>p.name in r ? `<td class="${p.name===ME?"me":""}"><span class="vb-c" style="background:${tint(r[p.name])}" data-vface="${esc(p.name)} on ${esc(it.name)}: ${sgn(r[p.name])}, ${esc(VLAB[r[p.name]])}" role="button" tabindex="0">${sgn(r[p.name])}</span></td>` : `<td class="${p.name===ME?"me":""}"><span class="vb-c e" aria-label="${esc(p.name)}: no vote yet">·</span></td>`).join("")}<td class="vb-a">${avg==null?`<span class="vb-c e">·</span>`:`<span class="vb-c avg" style="background:${tint(Math.round(avg))}">${avg>0?"+":""}${avg.toFixed(1)}</span>`}</td></tr>`; };
  const body = groups.map(g=>`<tr class="vb-g"><th colspan="${VOTERS.length+2}">${esc(g.t)}</th></tr>${g.items.map(row).join("")}`).join("");
  const key = [-5,-3,0,3,5].map(s=>`<span class="vb-c" style="background:${tint(s)}">${sgn(s)}</span>`).join("");
  return `<div class="bd-card vb-card" role="dialog" aria-modal="true" aria-labelledby="vbT"><div class="bd-top"><h2 id="vbT">Everyone's votes</h2><button class="theme-btn" data-shclose aria-label="Close">✕</button></div>
    <p class="small muted" style="margin:0 0 8px">One row per thing, one column per person. Tap a number to see who and what it means. Tap a name on the left to jump to that item. The All column is each result as counted when voting closed on Sat Oct 31.</p>
    <div class="vb-key"><span class="tiny muted">Couldn't pay me</span>${key}<span class="tiny muted">Non-negotiable</span><span class="tiny muted" style="margin-left:auto">· no vote yet</span></div>
    ${vote.all ? `<table class="vb"><thead>${head}</thead><tbody>${body}</tbody></table>` : `<p class="small muted">${vote.err?"Couldn't reach the vote box.":"Loading everyone's votes…"}</p>`}
    <button class="btn red" data-shclose style="width:100%;justify-content:center;margin-top:12px">Done</button></div>`;
}

/* Under each ranking card: where everyone placed each option, how the count goes, and every ballot. */
function rankChart(stop, ballots, res){
  const names = VOTERS.map(p=>p.name).filter(n=>ballots[n]); const n = names.length; if(!n) return "";
  const opts = stop.options, k = opts.length, ORD = ["1st","2nd","3rd","4th","5th","6th"], hd = i => k>3 ? ORD[i] : ORD[i]+" choice";
  const short = key => esc(opts.find(o=>o.key===key).short);
  const cell = (o,i) => { const who = names.filter(p=>ballots[p][i]===o.key); return `<div class="pl-c" style="--a:${who.length/n}" aria-label="${short(o.key)}, ${ORD[i]} choice: ${who.length ? esc(who.join(", ")) : "nobody"}">${who.length ? `${faces(who,"xs")}<b>${who.length}</b>` : `<span class="muted">0</span>`}</div>`; };
  const grid = `<div class="pl" style="grid-template-columns:minmax(84px,1.1fr) repeat(${k},minmax(0,1fr))"><div></div>${opts.map((_,i)=>`<div class="pl-h">${hd(i)}</div>`).join("")}${opts.map(o=>`<div class="pl-o">${short(o.key)}</div>${opts.map((_,i)=>cell(o,i)).join("")}`).join("")}</div>`;
  const rounds = res.rounds.map((r,ri)=>{
    const keys = opts.map(o=>o.key).filter(x=>x in r.count); const last = ri===res.rounds.length-1;
    const bars = keys.map(x=>{ const c = r.count[x], win = last && res.winner===x, out = r.out===x;
      return `<div class="rr-l">${short(x)}</div><div class="rr-t"><i class="${out?"out":""}" style="width:${r.live?c/r.live*100:0}%"></i></div><div class="rr-v"><b>${c}</b> of ${r.live}${win?` <span class="chip c-green">Leading</span>`:out?` <span class="chip c-line">Out</span>`:""}</div>`; }).join("");
    const say = last && res.winner ? (r.count[res.winner] > r.live/2 ? `${short(res.winner)} has more than half, so it leads.` : `${short(res.winner)} is the last one standing.`)
      : r.tie ? `Dead even. One more ranking breaks the tie.`
      : `Nobody has more than half. ${short(r.out)} has the fewest${r.tb?", tied for last and placed lower overall,":""} so it drops out and its ballots move to their next choice.`;
    return `<div class="rr">${res.rounds.length>1?`<div class="rr-h">Round ${ri+1}</div>`:""}<div class="rr-g">${bars}</div><p class="tiny muted">${say}</p></div>`;
  }).join("");
  const list = k>3
    ? `<div class="rbl">${names.map(p=>`<div class="rbl-r"><span class="rb-p">${face(p,"xs")}${esc(p)}</span><span class="rbl-c">${ballots[p].map((x,i)=>`<span><i>${i+1}</i>${short(x)}</span>`).join("")}${ballots[p].length<k?`<span class="rbl-un">${k-ballots[p].length} not placed</span>`:""}</span></div>`).join("")}</div>`
    : `<div class="pl rb" style="grid-template-columns:minmax(84px,1.1fr) repeat(${k},minmax(0,1fr))"><div></div>${opts.map((_,i)=>`<div class="pl-h">${hd(i)}</div>`).join("")}${names.map(p=>`<div class="pl-o rb-p">${face(p,"xs")}${esc(p)}</div>${opts.map((_,i)=>ballots[p][i] ? `<div class="rb-c">${short(ballots[p][i])}</div>` : `<div class="rb-c muted">not placed</div>`).join("")}`).join("")}</div>`;
  const not = VOTERS.map(p=>p.name).filter(x=>!ballots[x]);
  const body = `<h4 class="tiny muted caps">Where everyone put each one</h4>${grid}
    <h4 class="tiny muted caps">How the count goes</h4><p class="tiny muted" style="margin:2px 0 6px">First choices are counted. More than half of the ${n} ranking${n===1?"":"s"} wins; the dashed line marks half. A place someone has not placed yet sits below everything they did place.</p>${rounds}
    <h4 class="tiny muted caps">Everyone's ranking</h4>${list}${not.length?`<p class="tiny muted vw-no">Not ranked yet: ${faces(not,"xs")} ${not.map(esc).join(", ")}</p>`:""}`;
  return fold(`<span class="small">Placements and who ranked what · ${n} of 7</span>`, body, !!foldOpen["rc-"+stop.id], "plain mini rchart", `data-keep="rc-${stop.id}"`);
}

function badgeProg(b, p){
  const name = p.name, has = id => itemVotes(id).some(v=>v.person===name);
  const cnt = arr => ({n:arr.filter(Boolean).length, of:arr.length});
  switch(b.id){
    case "first": return {n:VOTE_ITEMS.some(it=>has(it.id))?1:0, of:1};
    case "decider": return cnt(VOTE_ITEMS.filter(it=>it.open).map(it=>has(it.id)));
    case "every": return cnt(VOTE_ITEMS.map(it=>has(it.id)));
    case "ranker": return cnt(STOPS.filter(s=>s.decide).map(s=>!!ballotsFor(s)[name]));
    case "face": return {n:hasPf(name)?1:0, of:1};
    case "flight": return {n:p.pending?0:1, of:1};
    case "permit": return {n:actDone("idp", name)?1:0, of:1};
    case "caught": return cnt(actFor(p).filter(a=>a.level==="now").map(a=>actDone(a.id, name)));
    case "allset": return cnt(actFor(p).map(a=>actDone(a.id, name)));
    case "note": return {n:(rp.all||[]).some(x=>x.person===name)?1:0, of:1};
    case "sage": statsSoon(); return {n:(crewStats.ai[name]||0) > 0 ? 1 : 0, of:1};
    case "hideout": return {n:actDone("homescreen", name)?1:0, of:1};
    case "bell": statsSoon(); return {n:crewStats.push.includes(name) ? 1 : 0, of:1};
    case "square": { if(!tabSt.data){ if(meP() && !tabSt.loading && !tabSt.err) setTimeout(()=>tabLoad(), 0); return {n:0, of:1}; }
      const d = tabSt.data, owed = d.items.some(x=>x.status==="ok" && x.person===name), net = tabNets(d)[name] || 0;
      return {n: owed && net >= 0 ? 1 : 0, of:1}; }
  }
  if(b.egg) return {n:(vote.all||[]).some(v=>v.item==="egg-"+b.egg && v.person===name && v.score>0)?1:0, of:1};
  return {n:0, of:1};
}
const badgeGot = (b, p) => { const r = badgeProg(b, p); return r.n >= r.of; };
const badgesOf = p => vote.all ? BADGES.filter(b=>badgeGot(b, p)) : [];
const seal = (b, on, cls="", tip=true) => `<span class="bdg ${b.c} ${on?"":"off"} ${cls}" ${on&&tip?`data-vface="${esc(b.name)}"`:""} aria-hidden="true"><svg viewBox="0 0 48 48">${BDG_ART[on || !b.secret ? b.i : "secret"]}</svg></span>`;
let badgeFresh = [];   // badge ids earned since the last look, so the stamp can land once
function badgeStrip(){
  const me = meP(); if(!me) return "";
  if(!vote.all) return `<div class="bdg-strip" id="bdgStrip"><span class="small muted">${vote.err?"Badges need a connection.":"Loading your badges…"}</span></div>`;
  const got = BADGES.filter(b=>badgeGot(b, me)), next = BADGES.find(b=>!b.secret && !badgeGot(b, me)), left = BADGES.length - got.length;
  return `<button class="bdg-strip" id="bdgStrip" data-badges aria-label="Your badges: ${got.length} of ${BADGES.length}. Tap to see them all."><span class="bdg-row">${got.map(b=>seal(b, true, badgeFresh.includes(b.id) ? "new" : "", false)).join("")}${left?`<span class="bdg-more">+${left}</span>`:""}</span><span class="bdg-cap"><b>${got.length} of ${BADGES.length} badges</b>${next?` · next: ${esc(next.name)}`:left?" · only secrets left":" · the full set"}</span></button>`;
}
function crewBadgeN(p){ const n = badgesOf(p).length; return n ? `<i class="crew-n" aria-label="${n} badge${n===1?"":"s"}">${n}</i>` : ""; }
function badgeSheet(){
  const me = meP();
  if(!vote.all) return `<div class="bd-card" role="dialog" aria-modal="true"><div class="bd-top"><h2>Badges</h2><button class="theme-btn" data-shclose aria-label="Close">✕</button></div><p class="small muted">${vote.err?"Couldn't reach the vote box. Try again in a bit.":"Loading…"}</p></div>`;
  const card = b => { const pr = me ? badgeProg(b, me) : {n:0, of:1}; const on = me && pr.n >= pr.of; const hid = b.secret && !on;
    const play = on && b.egg; const tag = play ? "button" : "div";
    return `<${tag} class="bg-b ${on?"on":""} ${play?"play":""}" ${play?`data-eggplay="${b.egg}"`:""}>${seal(b, on, "big", false)}<b>${hid?"???":esc(b.name)}</b>${hid?"":`<span class="bg-jp" lang="ja" aria-hidden="true">${esc(b.jp)}</span>`}<span class="tiny muted">${hid?"A secret one. You'll know it when you find it.":esc(b.how)}</span>${on?(play?`<span class="chip c-gold">${esc(b.again)}</span>`:`<span class="chip c-green">Earned</span>`):pr.of>1?`<span class="bg-p"><i style="width:${pr.n/pr.of*100}%"></i></span><span class="tiny muted">${pr.n} of ${pr.of}</span>`:""}</${tag}>`; };
  const mine = me ? badgesOf(me).length : 0;
  return `<div class="bd-card" role="dialog" aria-modal="true" aria-labelledby="bgT"><div class="bd-top"><h2 id="bgT">Badges</h2><button class="theme-btn" data-shclose aria-label="Close">✕</button></div>
    <p class="small muted" style="margin:0 0 10px">Earned by getting your part of the trip done. They work themselves out from what you do on the site, and everyone can see everyone's.</p>

    ${crewProgress()}
    <h3 class="bg-h">${me?"Yours":"The badges"}</h3>
    ${me?`<div class="bg-me"><button class="bp-face" data-bdperson="${esc(me.name)}" aria-label="Open your badges">${face(me.name,"lgm")}</button><div><b>${esc(me.name)}: ${mine} of ${BADGES.length}</b><span class="bg-p"><i style="width:${mine/BADGES.length*100}%"></i></span></div></div>`:`<p class="small muted">Pick who you are to see your own.</p>`}
    <div class="bg-grid">${BADGES.map(card).join("")}</div>
    <p class="tiny muted">Tap a badge to see its name.</p>
    <button class="btn red" data-shclose style="width:100%;justify-content:center;margin-top:8px">Done</button></div>`;
}

const BDG_SHORT = {first:"First vote", decider:"Undecided votes", every:"All votes", ranker:"Stay rankings", face:"Photo", flight:"Flights", permit:"Driving permit", caught:"Needs you", allset:"All to-dos", note:"Sent a note", sage:"Asked Amine AI", hideout:"Home Screen app", bell:"Notifications", square:"Paid back"};
/* v59: who has used Amine AI and who has notifications on, for the badges (names and counts only) */
const crewStats = {ai:{}, push:[], loaded:false, loading:false, at:0};
function statsSoon(){ if(!crewStats.loading && Date.now() - crewStats.at > 60000) setTimeout(statsLoad, 0); }

/* What one person still has left for a badge, by name, where a list makes sense. */
function badgeLeft(b, p){
  const name = p.name, has = id => itemVotes(id).some(v=>v.person===name);
  switch(b.id){
    case "every": return VOTE_ITEMS.filter(it=>!has(it.id)).map(it=>it.name);
    case "decider": return VOTE_ITEMS.filter(it=>it.open && !has(it.id)).map(it=>it.name);
    case "ranker": return STOPS.filter(s=>s.decide && !ballotsFor(s)[name]).map(s=>s.title);
    case "caught": return actFor(p).filter(a=>a.level==="now" && !actDone(a.id, name)).map(a=>a.t);
    case "allset": return actFor(p).filter(a=>!actDone(a.id, name)).map(a=>a.t);
  }
  return [];
}
/* One sentence about where a person stands on a badge. */
function badgeSay(b, p, cap){
  const r = badgeProg(b, p); if(r.n >= r.of) return "Done.";
  if(b.id==="first") return "No votes yet.";
  if(r.of < 2) return "Not yet.";
  const miss = badgeLeft(b, p);
  return `${r.n} of ${r.of} done.` + (miss.length && miss.length <= cap ? ` Left: ${miss.join("; ")}.` : miss.length ? ` ${miss.length} left.` : "");
}

  const got = badgesOf(p), plain = BADGES.filter(b=>!b.secret), todo = plain.filter(b=>!badgeGot(b, p)), secrets = BADGES.filter(b=>b.secret);

  const j = sub.toJSON(); await crewFetch("/push/sub", {person:ME, sub:{endpoint:j.endpoint, keys:j.keys}, ua:ua.slice(0, 150)});
  store.set("j26-push", {person:ME, at:Date.now()});

  return `<button class="pn-open ai-card" data-aiopen><span class="ai-av" aria-hidden="true">AI</span><span><b>Ask Amine AI</b><span class="small muted">${sub}</span></span><span aria-hidden="true">›</span></button>`;

/* safe, tiny markdown: **bold**, [text](#page) links inside the site, "- " bullets, line breaks */
function aiMd(s){
  const inl = x => esc(x).replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[([^\]]+)\]\((#[a-z0-9/_-]+)\)/gi, (m, a, h)=>`<a href="${h}" data-aigo>${a}</a>`);
  const out = []; let list = null;
  String(s || "").split(/\n/).forEach(line=>{ const b = line.match(/^\s*[-*•]\s+(.*)$/);
    if(b){ (list = list || []).push(`<li>${inl(b[1])}</li>`); return; }
    if(list){ out.push(`<ul>${list.join("")}</ul>`); list = null; }
    if(line.trim()) out.push(`<p>${inl(line)}</p>`); });
  if(list) out.push(`<ul>${list.join("")}</ul>`);
  return out.join("");
}

function openAi(){
  if(!meP()){ openPicker(); return; }

  closeReport(); openSheet("aiOv", aiHtml()); aiDraw(); const t = document.getElementById("aiText"); if(t && innerWidth >= 760) t.focus();

const AI_ERR = {limit:"That's your questions for today. More tomorrow. You can still send a note any time with the Report to Puran-sama bubble.",
  paused:"Amine AI is resting until next month. It used this month's budget. The agents still answer notes.", off:"Amine AI is off right now. Send a note with the Report to Puran-sama bubble instead."};
async function aiSend(text){
  text = String(text || "").trim(); if(!text || ai.busy || !meP()) return;
  const t = document.getElementById("aiText"); if(t) t.value = "";
  const mine = {role:"user", content:text}; ai.msgs.push(mine); ai.busy = true; aiDraw();
  const hist = ai.msgs.filter(m=>!m.err).map(m=>({role:m.role, content:m.content})).slice(-12);
  try{
    const r = await fetch(CREW_API + "/ai", {method:"POST", headers:{"X-Key":VOTE_KEY, "Content-Type":"application/json"}, body:JSON.stringify({person:ME, page:location.hash || "#home", messages:hist})});
    const j = await r.json().catch(()=>({}));
    if(r.ok && j.reply){ ai.msgs.push({role:"assistant", content:j.reply, notes:j.notes || []}); if(ai.st) ai.st.left = j.left; if(j.notes && j.notes.length){ rp.all = null; loadNotes(true); } }
    else { mine.err = true; ai.msgs.push({role:"assistant", err:true, content:AI_ERR[j.error] || "Something went wrong on my end. Try again in a minute."});
      if(j.error === "limit" && ai.st) ai.st.left = 0; if(j.error === "paused" && ai.st) ai.st.paused = true; }
  }catch(e){ mine.err = true; ai.msgs.push({role:"assistant", err:true, content:"Couldn't reach Amine AI. Check your signal and try again."}); }

}
document.addEventListener("click", e=>{

  if(e.target.id === "aiSend"){ const t = document.getElementById("aiText"); aiSend(t && t.value); return; }
  const q = e.target.closest("[data-aiask]"); if(q){ aiSend(q.dataset.aiask); return; }
  if(e.target.closest("[data-ainotes]")){ closeSheets(); openReport(); return; }
  if(e.target.closest("[data-aigo]")){ closeSheets(); return; }
});
document.addEventListener("keydown", e=>{ if(e.target.id === "aiText" && e.key === "Enter" && !e.shiftKey && innerWidth >= 760){ e.preventDefault(); aiSend(e.target.value); } });

   have something they wanna say they can message like before". Amine AI asks, saves the Bags page, and the chat ends.

const bagAiOn = () => aiOn() && !(ai.st && ai.st.paused);
const BAG_OPEN = n => `Hi ${n}! Quick bags check for Japan. What are you bringing? Tell me each bag (backpack or carry-on, checked suitcase, anything big) and roughly how big each one is.`;

}
function bagAiHtml(){
  return `<div class="bd-card ai-sheet" role="dialog" aria-modal="true" aria-labelledby="baT"><div class="bd-top"><h2 id="baT"><span class="ai-av" aria-hidden="true">AI</span> Your bags</h2><button class="theme-btn" data-shclose aria-label="Close">✕</button></div>
    <p class="tiny muted" style="margin:0 0 8px">Amine AI is a bot, not Amine. This chat is only about your bags; for anything else use the Report to Puran-sama bubble. Amine can read this chat.</p>
    <div class="ai-log" id="bagAiLog" aria-live="polite">${bagAiLogHtml()}</div><div id="bagAiFoot">${bagAiFoot()}</div></div>`;

function bagAiDraw(){ const l = document.getElementById("bagAiLog"); if(!l) return; l.innerHTML = bagAiLogHtml(); l.scrollTop = l.scrollHeight; const f = document.getElementById("bagAiFoot"); if(f && (bagAi.done || !document.getElementById("bagAiText"))) f.innerHTML = bagAiFoot(); const b = document.getElementById("bagAiSend"); if(b){ b.disabled = bagAi.busy; b.textContent = bagAi.busy ? "…" : "Send"; } }
function openBagAi(){
  const me = meP(); if(!me){ openPicker(); return; }
  bagAi.msgs = [{role:"assistant", content:BAG_OPEN(me.name), local:true}]; bagAi.busy = false; bagAi.done = false; bagAi.saved = false;
  closeReport(); openSheet("bagAiOv", bagAiHtml()); bagAiDraw(); const t = document.getElementById("bagAiText"); if(t && innerWidth >= 760) t.focus();
}
const BAG_ERR = {limit:"That's enough bags chat for today. You can fill in the page yourself, or try again tomorrow.", paused:AI_ERR.paused, off:"Amine AI is off right now. You can fill in the page yourself."};
async function bagAiSend(text){
  text = String(text || "").trim(); const me = meP(); if(!text || bagAi.busy || bagAi.done || !me) return;
  const t = document.getElementById("bagAiText"); if(t) t.value = "";
  const mine = {role:"user", content:text}; bagAi.msgs.push(mine); bagAi.busy = true; bagAiDraw();
  const hist = bagAi.msgs.filter(m=>!m.err && !m.local).map(m=>({role:m.role, content:m.content}));
  try{
    const r = await fetch(CREW_API + "/ai/bags", {method:"POST", headers:{"X-Key":VOTE_KEY, "Content-Type":"application/json"}, body:JSON.stringify({person:me.name, messages:hist})});
    const j = await r.json().catch(()=>({}));
    if(r.ok && j.reply){
      bagAi.msgs.push({role:"assistant", content:j.reply, saved:j.saved || null});
      if(j.saved){ bagAi.saved = true; bagsSt.all = (bagsSt.all||[]).filter(x=>x.person!==me.name).concat([{person:me.name, updated:j.updated, bags:j.saved.bags||[], c:j.saved.c||null, note:j.saved.note||""}]);
        bagsSt.dirty = false; bagsSt.synced = false; bagsSt.draftFor = null; keepScroll = true; render(); badgeSoon(); }
      if(j.done) bagAi.done = true;
    } else { mine.err = true; bagAi.msgs.push({role:"assistant", err:true, content:BAG_ERR[j.error] || "Something went wrong on my end. Try again in a minute, or fill in the page yourself."}); if(j.error === "limit" || j.error === "off" || j.error === "paused") bagAi.done = true; }
  }catch(e){ mine.err = true; bagAi.msgs.push({role:"assistant", err:true, content:"Couldn't reach Amine AI. Check your signal and try again."}); }
  bagAi.busy = false; bagAiDraw();
}
document.addEventListener("click", e=>{
  if(e.target.closest("[data-bagai]")){ openBagAi(); return; }
  if(e.target.id === "bagAiSend"){ const t = document.getElementById("bagAiText"); bagAiSend(t && t.value); return; }

});
document.addEventListener("keydown", e=>{ if(e.target.id === "bagAiText" && e.key === "Enter" && !e.shiftKey && innerWidth >= 760){ e.preventDefault(); bagAiSend(e.target.value); } });

/* ===================== v53 to v56 (Oct 23): tabs, as a web, with settle up =====================
   Anyone can owe anyone. An item says "person owes creditor" (someone paid for him); a payback says "person paid payee".
   Nothing counts until both sides mark it: a new charge waits for the person who owes to OK it, and a payback waits for
   the other side to confirm. If one side says no, it's disputed and Kodu settles it on Amine's word.
   Everyone sees everything (Amine, Oct 23). Debts cancel out across the group: each person's net balance is what
   everyone paid for him minus what he paid for others, adjusted by paybacks, and "Settle up" lists the fewest payments
   that square everyone. Any payment between any two people counts toward it. Marking needs this phone linked (once). */
const tabSt = {data:null, for:null, loading:false, err:false, busy:false, exp:null, pay:null};
function tabToken(){
  let t = store.get("j26-tabtok", "");
  if(!/^[A-Za-z0-9_-]{40,64}$/.test(t)){ const a = new Uint8Array(32); crypto.getRandomValues(a); t = btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); store.set("j26-tabtok", t); }
  return t;
}
const cents$ = c => "$" + (c/100).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const tabDay = iso => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("en-US", {month:"short", day:"numeric", timeZone:"America/New_York"}); };
const tabDate = d => { const t = Date.parse(d + "T12:00:00Z"); return isNaN(t) ? "" : new Date(t).toLocaleDateString("en-US", {month:"short", day:"numeric", timeZone:"UTC"}); };
async function tabCall(body){
  const r = await fetch(CREW_API + "/tab", {method:"POST", headers:{"X-Key":VOTE_KEY, "Content-Type":"application/json"}, body:JSON.stringify({token:tabToken(), ...body})});
  let j = {}; try{ j = await r.json(); }catch(_){}
  if(!r.ok){ const e = new Error(j.error || r.status); e.j = j; throw e; }
  return j;
}
const tabShape = j => Array.isArray(j.items) && Array.isArray(j.pays);
async function tabLoad(force){
  const me = meP(); if(!me || tabSt.loading) return;
  if(tabSt.data && tabSt.for === me.name && !force) return;
  tabSt.loading = true; tabSt.err = false;
  try{ const j = await tabCall({act:"read", person:me.name}); if(!tabShape(j)) throw new Error("shape"); tabSt.data = j; tabSt.for = me.name; }
  catch(e){ tabSt.err = true; }
  tabSt.loading = false; badgeSoon();
  const v = location.hash.replace("#","").split("/")[0] || "home"; if(v === "money" || v === "home"){ keepScroll = true; render(); }
}
/* net[p] > 0: the group owes p. net[p] < 0: p owes the group. Only OK'd charges and confirmed paybacks count. */
function tabNets(d){
  const net = {}; PEOPLE.forEach(p=>net[p.name]=0);
  d.items.filter(x=>x.status==="ok").forEach(x=>{ net[x.creditor] = (net[x.creditor]||0) + x.cents; net[x.person] = (net[x.person]||0) - x.cents; });
  d.pays.filter(p=>p.status==="confirmed").forEach(p=>{ net[p.person] = (net[p.person]||0) + p.cents; net[p.payee] = (net[p.payee]||0) - p.cents; });
  return net;
}
/* the fewest payments that square everyone: biggest debtor pays biggest creditor, repeat */
function tabPlan(net){
  const owe = Object.entries(net).filter(([,v])=>v<0).map(([n,v])=>({n, v:-v})).sort((a,b)=>b.v-a.v||a.n.localeCompare(b.n));
  const get = Object.entries(net).filter(([,v])=>v>0).map(([n,v])=>({n, v})).sort((a,b)=>b.v-a.v||a.n.localeCompare(b.n));
  const out = []; let i = 0, j = 0;
  while(i < owe.length && j < get.length){
    const c = Math.min(owe[i].v, get[j].v);
    if(c > 0) out.push({from:owe[i].n, to:get[j].n, c});
    owe[i].v -= c; get[j].v -= c;
    if(owe[i].v <= 0) i++; if(get[j].v <= 0) j++;
  }
  return out;
}
/* one person's itemized receipt: what others paid for him, what he paid for others, paybacks, and where he stands */
function tabReceipt(d, p, me, live, net){
  const you = p === me, P = you ? "you" : esc(p);
  const forHim = d.items.filter(x=>x.person===p && x.status==="ok"), byHim = d.items.filter(x=>x.creditor===p && x.status==="ok");
  const paid = d.pays.filter(x=>x.status==="confirmed" && x.person===p), got = d.pays.filter(x=>x.status==="confirmed" && x.payee===p);
  const line = (x, who) => `<div class="rc-item"><div class="rc-row"><span>${esc(x.label)} <span class="muted">· ${who}</span></span><b>${cents$(x.cents)}</b></div>`
    + `<div class="rc-sub">${[x.paid_on ? tabDate(x.paid_on) : "", x.yen != null ? yen(x.yen) : ""].filter(Boolean).join(" · ")}</div>`
    + String(x.detail || "").split("\n").filter(Boolean).map(l=>`<div class="rc-sub">${esc(l)}</div>`).join("") + `</div>`;
  const sum = a => a.reduce((t,x)=>t+x.cents,0);
  const sec = (h, list, f) => list.length ? `<div class="rc-sec">${h}<span>${cents$(sum(list))}</span></div>${list.map(f).join("")}` : "";
  const pay = (x, txt) => `<div class="rc-row rc-paid"><span>${txt} ${tabDay(x.created)}${x.note ? " · " + esc(x.note) : ""}</span><span>${cents$(x.cents)}</span></div>`;
  const n = net[p] || 0;
  const pend = d.items.filter(x=>x.status==="waiting"||x.status==="disputed").filter(x=>x.person===p||x.creditor===p).map(x=>tabPendRow("item", x, me, live))
    .concat(d.pays.filter(x=>x.status==="waiting"||x.status==="disputed").filter(x=>x.person===p||x.payee===p).map(x=>tabPendRow("pay", x, me, live))).join("");
  const empty = !forHim.length && !byHim.length && !paid.length && !got.length;
  const body = empty ? `<p class="small muted" style="margin:4px 0 0">Nothing confirmed yet.</p>` : `<div class="receipt" role="table" aria-label="Itemized receipt for ${esc(p)}"><div class="rc-h"><b>Receipt</b><span>${esc(p)}</span></div>`
    + sec(`Paid for ${P}`, forHim, x=>line(x, x.creditor===me ? "by you" : "by " + esc(x.creditor)))
    + sec(`${you ? "You" : esc(p)} paid for`, byHim, x=>line(x, "for " + (x.person===me ? "you" : esc(x.person))))
    + sec(`${you ? "You" : esc(p)} paid back`, paid, x=>pay(x, `To ${x.payee===me ? "you" : esc(x.payee)}`))
    + sec(`${you ? "You" : esc(p)} got back`, got, x=>pay(x, `From ${x.person===me ? "you" : esc(x.person)}`))
    + `<div class="rc-row rc-bal${n ? (n>0 ? " zero" : "") : " zero"}"><span>${n<0 ? `${you ? "You owe" : esc(p) + " owes"} the group` : n>0 ? `The group owes ${P}` : "All square"}</span><b>${cents$(Math.abs(n))}</b></div></div>`;
  return body + (pend ? `<div style="margin-top:6px">${pend}</div>` : "");
}
/* a charge or payback that isn't settled yet; buttons only for the side that has to act, on a linked phone */
function tabPendRow(kind, x, me, live){
  let chip = "", btns = "", what = "";
  const nm = n => n===me ? "you" : esc(n), Nm = n => n===me ? "You" : esc(n);
  if(kind === "item"){
    what = `<b>${cents$(x.cents)}</b> <span class="small">${esc(x.label)}: ${Nm(x.creditor)} paid for ${nm(x.person)}</span> <span class="small muted">${x.paid_on ? tabDate(x.paid_on) : ""}</span>`;
    if(x.status === "disputed") chip = `<span class="chip c-red">Disputed</span><div class="tiny muted" style="margin-top:3px">Kodu will sort it out.</div>`;
    else if(x.person === me){ chip = `<span class="chip c-ind">${esc(x.creditor)} says he paid this for you</span>`; btns = `<button class="btn red sm" data-tabitem="${x.id}:1">OK</button> <button class="btn ghost sm" data-tabitem="${x.id}:0">That's not right</button>`; }
    else if(x.creditor === me){ chip = `<span class="chip c-gold">Waiting for ${esc(x.person)} to OK</span>`; btns = `<button class="linkbtn" data-tabitemwd="${x.id}">Take it back</button>`; }
    else chip = `<span class="chip c-gold">Waiting for ${esc(x.person)} to OK</span>`;
  } else {
    what = `<b>${cents$(x.cents)}</b> <span class="small">${Nm(x.person)} paid ${nm(x.payee)}</span> <span class="small muted">${tabDay(x.created)}${x.note ? " · " + esc(x.note) : ""}${x.resolve_note ? " · " + esc(x.resolve_note) : ""}</span>`;
    const waitingOn = x.payer_ok ? x.payee : x.person;
    if(x.status === "disputed") chip = `<span class="chip c-red">Disputed</span><div class="tiny muted" style="margin-top:3px">Kodu will sort it out.</div>`;
    else if(waitingOn === me){ const iPaid = x.person === me; chip = `<span class="chip c-ind">${iPaid ? `${esc(x.payee)} says you paid him` : `${esc(x.person)} says he paid you`}</span>`; btns = `<button class="btn red sm" data-tabans="${x.id}:1">${iPaid ? "Yes, I paid" : "Got it"}</button> <button class="btn ghost sm" data-tabans="${x.id}:0">${iPaid ? "That's not right" : "Didn't get it"}</button>`; }
    else if(x.person === me || x.payee === me){ chip = `<span class="chip c-gold">Waiting for ${esc(waitingOn)}</span>`; btns = `<button class="linkbtn" data-tabwd="${x.id}">Take it back</button>`; }
    else chip = `<span class="chip c-gold">Waiting for ${esc(waitingOn)}</span>`;
  }
  if(!live) btns = "";
  return `<div class="tab-pay"><div class="tab-pay-l">${what}<div class="row" style="margin-top:3px">${chip}</div></div>${btns ? `<div class="tab-pay-b">${btns}</div>` : ""}</div>`;
}
/* record a payment, any amount, with anyone */
function tabPayForm(me){
  const others = PEOPLE.map(p=>p.name).filter(n=>n!==me);
  const f = tabSt.pay || (tabSt.pay = {who:null, amt:"", note:""});
  return `<div class="tab-form" style="margin-top:0;padding-top:0;border-top:0">
    <div style="flex-basis:100%"><span class="small">With</span><div class="tab-who">${others.map(p=>`<button class="tab-chip ${f.who===p?"on":""}" data-tabpaywho="${esc(p)}" aria-pressed="${f.who===p}">${face(p,"xs")}${esc(p)}</button>`).join("")}</div></div>
    <label class="small"><span>Amount ($)</span><input type="number" inputmode="decimal" step="0.01" min="0.01" data-tabpayf="amt" value="${esc(f.amt)}"></label>
    <label class="small"><span>Note (optional)</span><input type="text" maxlength="120" data-tabpayf="note" placeholder="Zelle, cash…" value="${esc(f.note)}"></label>

const TAB_ERR = {link:"Link this phone first.", amount:"Enter an amount from $0.01 to $5,000 a person.", "too many":"Too many are waiting. Wait for the other side to confirm.", gone:"That one already changed. Refreshed.", nope:"You can't do that one.", label:"Say what it was for.", people:"Pick who it's for."};
async function tabDo(body, ok, after){
  if(tabSt.busy) return; tabSt.busy = true;
  try{ const j = await tabCall(body); if(after) after(); if(tabShape(j)){ tabSt.data = j; tabSt.for = (meP()||{}).name; } else { tabSt.busy = false; await tabLoad(true); } toast(ok); }
  catch(e){ toast(TAB_ERR[e.message] || "Couldn't save. Check your connection and try again."); if(e.message==="gone" || e.message==="link"){ tabSt.busy = false; await tabLoad(true); } }
  finally{ tabSt.busy = false; keepScroll = true; render(); }
}

    catch(e2){ toast("Couldn't link. Try again."); }
    tabSt.busy = false; keepScroll = true; render(); return; }
  const pw = e.target.closest("[data-tabpaywho]"); if(pw && tabSt.pay){ tabSt.pay.who = pw.dataset.tabpaywho; keepScroll = true; render(); return; }
  const pl = e.target.closest("[data-tabplan]"); if(pl){ const [o, c, dir] = pl.dataset.tabplan.split(":"); tabSt.pay = {who:o, amt:(+c/100).toFixed(2), note:"", dir}; foldOpen.tabpay = true; keepScroll = true; render();
    const el = document.querySelector('[data-keep="tabpay"]'); if(el) el.scrollIntoView({behavior:"smooth", block:"center"}); toast(`Check the amount, then tap "${dir==="sent" ? "I paid " + o : o + " paid me"}".`); return; }
  const pg = e.target.closest("[data-tabpaygo]"); if(pg && tabSt.pay){ const f = tabSt.pay, dir = pg.dataset.tabpaygo;
    const cents = Math.round(parseFloat(f.amt) * 100);

  /* vignette */
  const vg = g.createRadialGradient(W/2,H/2,Math.min(W,H)*0.35,W/2,H/2,Math.hypot(W,H)*0.6); vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.75)");
  g.fillStyle = vg; g.fillRect(0,0,W,H);

  /* petals */
  const petals = [];
  for(let i=0;i<150;i++) petals.push({ x:R(0,W), y:R(-H,H), z:R(0.3,1), r:R(5,9), rot:R(0,6.283), rv:R(-2,2), ph:R(0,6.283), vx:0, vy:0, col:PINK[Math.floor(R(0,5))], cut:false, life:1 });
  const shards = [], sparks = [];
  function petal(c, x, y, r, rot, col, a){

    c.beginPath(); c.moveTo(0,-r); c.bezierCurveTo(r*0.95,-r*0.85, r*1.05, r*0.45, r*0.2, r); c.lineTo(0, r*0.7); c.lineTo(-r*0.2, r); c.bezierCurveTo(-r*1.05, r*0.45, -r*0.95,-r*0.85, 0,-r); c.fill();

  /* mist blobs */
  const mist = []; for(let i=0;i<14;i++) mist.push({ x:R(-0.1,1.1), y:(i>7?R(0.78,1.05):R(0.6,0.85)), r:R(0.18,0.4), s:R(0.004,0.012), a:R(0.07,0.15), front:i>7 });
  function drawMist(front, t){

    fx.strokeStyle = "rgba(255,255,255,0.07)"; fx.lineWidth = Math.max(1,S(0.006)); for(let i=1;i<6;i++){ fx.beginPath(); fx.moveTo(S(-0.13), S(-0.78+0.045*i)); fx.lineTo(S(0.13), S(-0.78+0.045*i)); fx.stroke(); }

  const T = { scene:0.5, walk0:1.3, walk1:4.1, draw0:4.2, draw1:4.65, slash:5.75, dark:6.2, card:6.65 };
  let streak = 0, flash = 0, shake = 0, burst = false, last = 0, start = 0;
  function dist2seg(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay; const l2=dx*dx+dy*dy||1; let k=((px-ax)*dx+(py-ay)*dy)/l2; k=k<0?0:k>1?1:k; const x=ax+dx*k, y=ay+dy*k; return Math.hypot(px-x,py-y); }
  function frame(now){
    if(done) return;
    if(!start) start = now; const t = (now-start)/1000; const dt = Math.min(0.05, (now-last)/1000 || 0.016); last = now;
    /* state */
    const wk = ease((t-T.walk0)/(T.walk1-T.walk0));
    const scale = 0.26 + 0.74*wk;
    const Hf = Math.min(H*0.52, W*1.1)*scale;
    const fy = horizon + (ground-horizon)*(0.1 + 0.9*wk);
    const cx = W*0.5 + (1-wk)*W*0.04;
    const drawn = ease((t-T.draw0)/(T.draw1-T.draw0));
    const walk = t<T.walk1 ? 1 : 0;
    let ang, handP;
    if(t < T.slash){
      const a0 = 1.2, a1 = -1.25; ang = a0 + (a1-a0)*drawn;
      handP = [0.21 - 0.04*drawn, -0.42 - 0.26*drawn];
    } else {
      const k = ease((t-T.slash)/0.13); ang = -1.25 + 3.15*k; handP = [0.17 - 0.4*k, -0.68 + 0.26*k];
      if(!burst && k>=0.55){ burst = true; streak = 1; flash = 1; shake = 1; petals.forEach(p=>{ const dx=p.x-cx, dy=p.y-(fy-Hf*0.5); const d=Math.hypot(dx,dy)||1; const f = (0.5+p.z)*R(9,16)*W/900; p.vx += dx/d*f*60; p.vy += dy/d*f*60; p.rv += R(-6,6); }); if(navigator.vibrate) navigator.vibrate(30); }
    }
    const glow = t<T.draw0 ? 0 : Math.min(1, (t-T.draw0)/0.3) * (1 + 0.08*Math.sin(t*40));
    const st = { walk, hand:handP, ang, blade: Math.max(0, t<T.draw0 ? 0 : Math.min(1,(t-T.draw0)/0.3)), glow };

    /* draw */
    ctx.save();
    if(shake>0){ ctx.translate(R(-1,1)*shake*7, R(-1,1)*shake*7); shake = Math.max(0, shake-dt*4); }
    ctx.drawImage(bg, 0, 0, W, H);
    /* lantern flicker */
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    lanterns.forEach(([lx,ly,lh],i)=>{ const f = 0.75 + 0.25*Math.sin(t*9+i*2) * Math.sin(t*13.7+i); const r = lh*2.2; const lg = ctx.createRadialGradient(lx, ly-lh*0.7, 0, lx, ly-lh*0.7, r); lg.addColorStop(0,`rgba(255,170,80,${0.22*f})`); lg.addColorStop(1,"rgba(255,170,80,0)"); ctx.fillStyle = lg; ctx.fillRect(lx-r, ly-lh*0.7-r, r*2, r*2); });
    ctx.restore();
    drawMist(false, t);
    /* petals: update, slice, draw far ones */
    const wind = Math.sin(t*0.7)*18 + 26;
    const bladeOut = st.blade>0.6 && t<T.slash+0.2;
    petals.forEach(p=>{
      const sp = (28 + p.z*50) * (1 + (burst?0.2:0));
      p.vx *= Math.pow(0.08, dt); p.vy *= Math.pow(0.08, dt);
      p.x += (wind*p.z + Math.sin(t*1.6+p.ph)*22*p.z)*dt + p.vx*dt;
      p.y += sp*dt + Math.cos(t*1.3+p.ph)*8*dt + p.vy*dt;
      p.rot += p.rv*dt;
      if(p.y > H+20){ p.y = -20; p.x = R(-W*0.2, W); }
      if(p.x > W+30) p.x = -30; if(p.x < -40) p.x = W+20;
      if(bladeOut && p.z>0.55 && dist2seg(p.x,p.y,hand.x,hand.y,tip.x,tip.y) < 9+p.r){
        const nx = Math.cos(st.ang+Math.PI/2), ny = Math.sin(st.ang+Math.PI/2);
        const px = p.x, py = p.y; p.y = -40; p.x = R(0,W);
        [1,-1].forEach(s=>{ shards.push({x:px, y:py, vx:nx*s*R(60,140)+R(-20,20), vy:ny*s*R(60,140)+R(-20,20), r:p.r*0.6, rot:p.rot, rv:R(-9,9), col:p.col, life:1, z:p.z}); });
        for(let i=0;i<5;i++) sparks.push({x:px,y:py,vx:R(-120,120),vy:R(-120,60),life:R(0.2,0.45)});
      }
    });
    petals.forEach(p=>{ if(p.z<0.55) petal(ctx, p.x, p.y, p.r*p.z*1.1, p.rot, p.col, 0.35+p.z*0.4); });
    /* figure */
    if(t > T.walk0-0.3){ drawFigure(cx, fy, Hf, t, st); }
    drawMist(true, t);
    petals.forEach(p=>{ if(p.z>=0.55) petal(ctx, p.x, p.y, p.r*p.z*1.1, p.rot, p.col, 0.6+p.z*0.4); });
    /* shards and sparks */
    for(let i=shards.length-1;i>=0;i--){ const s=shards[i]; s.life -= dt*1.6; s.vy += 160*dt; s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.rv*dt; if(s.life<=0){ shards.splice(i,1); continue; } petal(ctx, s.x, s.y, s.r*Math.max(0.2,s.life), s.rot, s.col, s.life); }
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.life -= dt; s.x += s.vx*dt; s.y += s.vy*dt; if(s.life<=0){ sparks.splice(i,1); continue; } ctx.fillStyle = `rgba(255,120,110,${Math.min(1,s.life*3)})`; ctx.beginPath(); ctx.arc(s.x,s.y,1.6,0,6.283); ctx.fill(); }
    ctx.restore();
    /* the slash streak and flash */
    if(streak>0){
      ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.translate(cx, fy-Hf*0.5); ctx.rotate(-0.95);
      const len = Math.hypot(W,H)*0.8, w = 26*streak;
      const sg = ctx.createLinearGradient(-len,0,len,0); sg.addColorStop(0,"rgba(255,60,80,0)"); sg.addColorStop(0.5,`rgba(255,235,240,${streak})`); sg.addColorStop(1,"rgba(255,60,80,0)");
      ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(-len,0); ctx.quadraticCurveTo(0,-w,len,0); ctx.quadraticCurveTo(0,w,-len,0); ctx.fill();
      ctx.fillStyle = `rgba(255,40,60,${0.35*streak})`; ctx.beginPath(); ctx.moveTo(-len,0); ctx.quadraticCurveTo(0,-w*3,len,0); ctx.quadraticCurveTo(0,w*3,-len,0); ctx.fill();
      ctx.restore(); streak = Math.max(0, streak - dt*2.6);
    }
    if(flash>0){ ctx.fillStyle = `rgba(255,235,235,${0.75*flash})`; ctx.fillRect(-20,-20,W+40,H+40); flash = Math.max(0, flash-dt*5); }
    ctx.restore();
    /* fades */
    if(t < T.scene+0.9){ ctx.fillStyle = `rgba(0,0,0,${1-ease((t-T.scene)/0.9)})`; ctx.fillRect(0,0,W,H); }
    if(t > T.dark){ ctx.fillStyle = `rgba(0,0,0,${ease((t-T.dark)/0.5)})`; ctx.fillRect(0,0,W,H); }
    if(t > T.card){ finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);
}

/* ---- boot ---- */
if("serviceWorker" in navigator && location.protocol==="https:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
  /* once the page is open, the service worker downloads every photo it doesn't have yet (about 7.5 MB, once), skipped on data saver */
  setTimeout(()=>{ const cn = navigator.connection; if(cn && (cn.saveData || /2g/.test(cn.effectiveType||""))) return;
    navigator.serviceWorker.ready.then(r=>{ if(r.active) r.active.postMessage({warm:Object.keys(PICS).map(k=>new URL("img/"+k+".webp", location.href).href)}); }).catch(()=>{}); }, 8000);
}

try{ localStorage.removeItem("staticrypt_passphrase"); localStorage.removeItem("staticrypt_expiration"); }catch(_){}
pfStyle(); mountBubble();
render();
if(gateOn()) showGate();
else { if(ME==null) openPicker(); else { maybeGuide(); if(!document.querySelector(".who-ov.open") && !maybeWhere()) maybePush(); } pushSync(); aiLoad(); }
loadPfps(); loadNotes();
